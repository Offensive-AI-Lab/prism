[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prism"
version = "1.0.0"
description = "Training pipeline for PRISM: Recovering Instruction Sets from Language Model Activations"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
authors = [
    { name = "Gilad Gressel" },
    { name = "Rahul Pankajakshan" },
    { name = "Julia Diament" },
    { name = "Efim Hudis" },
    { name = "Krishnashree Achuthan" },
    { name = "Yisroel Mirsky" },
]
keywords = ["interpretability", "language-models", "activations", "GRPO"]
dependencies = [
    "accelerate>=1.13.0",
    "aiohttp>=3.10.0",
    "datasets>=4.7.0",
    "openai>=2.44.0",
    "peft>=0.18.1",
    # pillow/torchvision: required by the AutoModelForImageTextToText load
    # path used for Qwen3.5/Ministral (image processor imports), even though
    # the pipeline is text-only.
    "pillow>=11.1.0",
    "safetensors>=0.7.0",
    "sentencepiece>=0.2.1",
    "torch>=2.10.0",
    "torchvision>=0.25.0",
    "tqdm>=4.66.0",
    "transformers>=5.3.0,<6",
    "wandb>=0.25.1",
]

[project.urls]
Repository = "https://github.com/Offensive-AI-Lab/prism"
Paper = "https://arxiv.org/abs/2606.09563"
Evaluation = "https://github.com/Offensive-AI-Lab/prism-eval"

[project.optional-dependencies]
# Oracle dataset generation with a local vLLM engine (the http_async backend
# needs only core deps and any OpenAI-compatible server).
datagen = ["vllm>=0.11.0"]
# Local Try-PRISM demo server.
demo = ["fastapi>=0.110.0", "uvicorn>=0.30.0", "pydantic>=2.7.0"]
# Optional BERTScore validation metric in the SFT trainer (degrades gracefully).
bertscore = ["bert-score>=0.3.13"]
dev = ["pytest>=8.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/prism"]

[tool.pytest.ini_options]
testpaths = ["tests"]
